# a new command has to be added to composer.json for it to be included in doc.md.

name: regenerate doc.md
on:
  workflow_run:
    workflows: [ "update commands section in composer.json" ]
    types: [completed]
  # run this workflow manually
  workflow_dispatch:

env:
  DOC: doc.md
  README: README.md
  WP_CLI_PACKAGES_DIR: /root/.wp-cli/packages

permissions:
  contents: write

jobs:
  regenerate-readme:
    name: Regenerate doc.md and commit it back to the repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    container:
      image: ghcr.io/baizman-design/wp-cli-package
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.BD_ACCESS_TOKEN }}
    steps:
      - name: check out the repository
        uses: actions/checkout@v4
      - name: install the custom command and generate the markdown documentation
        run: >
          wp package install ${GITHUB_WORKSPACE};
          wp package list;
          mv -v ${README} ${README}.bak;
          wp scaffold package-readme --branch=${{ github.event.repository.default_branch }} --force .;
          mv -v ${README} ${DOC};
          mv -v ${README}.bak ${README}
      - name: commit documentation, if needed
        run: >
          git config --global --add safe.directory '*';
          git config --global user.name 'Saul Baizman';
          git config --global user.email 'baizman-design@users.noreply.github.com';
          set +e;
          git diff --quiet --exit-code;
          if [ $? -eq 1 ];
          then
          set -e;
          added="$(git diff --numstat ${DOC} | awk '{print $1}')";
          echo "lines added: ${added:-0}" | tee -a ${GITHUB_STEP_SUMMARY};
          deleted="$(git diff --numstat ${DOC} | awk '{print $2}')";
          echo "lines deleted: ${deleted:-0}" | tee -a ${GITHUB_STEP_SUMMARY};
          git add ${DOC};
          git commit -m "Updated ${DOC} via GHA.";
          git push;
          echo "changes were successfully committed to the repository." | tee -a ${GITHUB_STEP_SUMMARY};
          else
          echo "it appears nothing changed." | tee -a ${GITHUB_STEP_SUMMARY};
          fi
