# https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-container-registry

name: publish ghcr package

on:
  push:
    branches:
      - production
    paths:
      - Dockerfile
  # run this workflow manually
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: wp-cli-package
  ORGANIZATION_NAME: baizman-design

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push the image to the github container registry
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          tags: ghcr.io/${{ env.ORGANIZATION_NAME }}/${{ env.IMAGE_NAME }}:latest
